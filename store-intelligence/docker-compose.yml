version: '3.8'

services:

  cv-pipeline:
    build:
      context: ./pipeline
      dockerfile: Dockerfile
    container_name: apex-cv-pipeline
    env_file:
      - .env
    depends_on:
      kafka-broker:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    networks:
      - apex-mesh-network
  # 1. High-Performance Cold Storage Ledger Database
  postgres-db:
    image: postgres:16-alpine
    container_name: apex-postgres-db
    environment:
      POSTGRES_USER: apex_admin
      POSTGRES_PASSWORD: apex_secure_password
      POSTGRES_DB: store_intelligence
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - apex-mesh-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apex_admin -d store_intelligence"]
      interval: 3s
      timeout: 3s
      retries: 5

  # 2. Hot-Path In-Memory State Cache & PubSub Coordinator
  redis-cache:
    image: redis:7.2-alpine
    container_name: apex-redis-cache
    ports:
      - "6379:6379"
    networks:
      - apex-mesh-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5

  # 3. Distributed In-Order Event Commit Log Messaging Queue
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: apex-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - apex-mesh-network

  kafka-broker:
    image: confluentinc/cp-kafka:7.5.0
    container_name: apex-kafka-broker
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-broker:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - apex-mesh-network
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 4. FastAPI Analytics Core Engine & Event Consumer Worker
  fastapi-app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: apex-fastapi-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      postgres-db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      kafka-broker:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    networks:
      - apex-mesh-network
    # Initializes database tables and launches BOTH the consumer thread and server thread concurrently
    command: >
      sh -c "python -c 'from db import init_db; init_db()' && 
            python ingestion.py & 
            uvicorn main:app --host 0.0.0.0 --port 8000 --reload"

  # 5. Live Streaming Retail Presentation UI Dashboard
  web-dashboard:
    image: nginx:alpine
    container_name: apex-web-dashboard
    ports:
      - "8080:80"
    volumes:
      - ./dashboard:/usr/share/nginx/html
    networks:
      - apex-mesh-network
    depends_on:
      - fastapi-app

volumes:
  postgres_data:

networks:
  apex-mesh-network:
    driver: bridge