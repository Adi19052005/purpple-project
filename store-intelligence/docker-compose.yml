services:

  cv-pipeline:
    build:
      context: ./pipeline
      dockerfile: Dockerfile
    container_name: apex-cv-pipeline
    env_file:
      - .env
    depends_on:
      kafka-broker:
        condition: service_healthy
    volumes:
      - ./data:/app/data:cached
    networks:
      - apex-mesh-network
    restart: unless-stopped
  # 1. High-Performance Cold Storage Ledger Database
  postgres-db:
    image: postgres:16-alpine
    container_name: apex-postgres-db
    environment:
      POSTGRES_USER: apex_admin
      POSTGRES_PASSWORD: apex_secure_password
      POSTGRES_DB: store_intelligence
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - apex-mesh-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apex_admin -d store_intelligence"]
      interval: 3s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # 2. Hot-Path In-Memory State Cache & PubSub Coordinator
  redis-cache:
    image: redis:7.2-alpine
    container_name: apex-redis-cache
    ports:
      - "6379:6379"
    networks:
      - apex-mesh-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # 3. Distributed In-Order Event Commit Log Messaging Queue
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: apex-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - apex-mesh-network
    restart: unless-stopped

  kafka-broker:
    image: confluentinc/cp-kafka:7.5.0
    container_name: apex-kafka-broker
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-broker:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_HEAP_OPTS: '-Xms512M -Xmx1G'
    networks:
      - apex-mesh-network
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server kafka-broker:29092 --list > /dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # 4. FastAPI Analytics Core Engine & Event Consumer Worker
  fastapi-app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: apex-fastapi-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      postgres-db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      kafka-broker:
        condition: service_healthy
    volumes:
      - ./data:/app/data:cached
    networks:
      - apex-mesh-network
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
    restart: unless-stopped

  ingestion-worker:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: apex-ingestion-worker
    env_file:
      - .env
    depends_on:
      postgres-db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      kafka-broker:
        condition: service_healthy
    volumes:
      - ./data:/app/data:cached
    networks:
      - apex-mesh-network
    command: ["sh", "-c", "python -c 'from db import init_db; init_db()' && exec python ingestion.py"]
    restart: unless-stopped

  # 5. Live Streaming Retail Presentation UI Dashboard
  web-dashboard:
    image: nginx:alpine
    container_name: apex-web-dashboard
    ports:
      - "8080:80"
    volumes:
      - ./dashboard:/usr/share/nginx/html:ro
    networks:
      - apex-mesh-network
    depends_on:
      - fastapi-app
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  apex-mesh-network:
    driver: bridge